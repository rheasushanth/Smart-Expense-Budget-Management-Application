# Render Blueprint — issue #70.
#
# Defines the environment TC-PERF-01 (NFR-001), TC-AVAIL-01 (NFR-002) and
# TC-POL-01 (NFR-007) need, so it is reproducible from the repository rather
# than configured by hand in a dashboard.
#
# Create both services with: Render dashboard -> New -> Blueprint, pointed at
# this repository.

databases:
  - name: smart-expense-db
    databaseName: smart_expense
    user: smart_expense
    plan: free
    # Must match the web service's region: Render's internal database
    # hostname only resolves within a region, and the default is Oregon.
    region: singapore

services:
  - type: web
    name: smart-expense
    runtime: python
    plan: free
    region: singapore
    rootDir: G15/04_IMPLEMENTATION_TESTING/source-code
    buildCommand: "pip install -r requirements.txt && ./build.sh"
    # NFR-001: the default is a single sync worker, which serves exactly one
    # request at a time. TC-PERF-01 at 50 users produced 591 502s (5.38%,
    # against a 1% budget) purely from requests queueing behind it, while the
    # measured endpoints themselves answered in 360-440 ms at the 95th
    # percentile. One process keeps inside the 512 MB the free plan allows;
    # the threads let the database waits overlap instead of blocking.
    startCommand: "gunicorn config.wsgi:application --worker-class gthread --workers 1 --threads 8 --timeout 60"
    # NFR-002: Render restarts the service when this stops returning 200.
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # Generated once by Render and held in the service, never in the repo.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Explicit, even though settings.py now defaults to False (#61, PR #73).
      # The default is the safety net; this is the statement of intent.
      - key: DJANGO_DEBUG
        value: "False"

      # This resolves to the service's INTERNAL hostname ("smart-expense-pz56"),
      # not the public one the application is served on. Requests arrive with
      # Host: <service>.onrender.com, so this value alone makes Django reject
      # every one of them with DisallowedHost, health checks included.
      # settings.py appends RENDER_EXTERNAL_HOSTNAME for the public name; this
      # entry remains because the internal name is what service-to-service
      # calls inside the private network use.
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: smart-expense
          property: host

      - key: DATABASE_URL
        fromDatabase:
          name: smart-expense-db
          property: connectionString
