
{% extends "base.html" %}

{% block content %}
<h2>Delete Transaction</h2>

<p>Are you sure you want to delete this transaction?</p>

<p>
    {{ transaction.type }} — {{ transaction.amount }}
    on {{ transaction.date }}
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>

<a href="{% url 'record_income' %}">Cancel</a>
{% endblock %}
