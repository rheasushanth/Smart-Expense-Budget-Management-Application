
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>{% if category %}Edit Category{% else %}Add Category{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Category</button>
        <a href="{% url 'categories:list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
