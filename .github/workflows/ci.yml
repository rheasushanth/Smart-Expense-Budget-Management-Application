name: CI

# TASK-02 / Project Plan E.5: automated checks on every push and pull request.
# Evidence for the CI/CD pipeline run log (04_IMPLEMENTATION_TESTING/CI-CD-evidence).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: G15/04_IMPLEMENTATION_TESTING/source-code

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: G15/04_IMPLEMENTATION_TESTING/source-code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term --cov-report=xml

      # NFR-005 requires at least 70% line coverage on the business-logic
      # apps. Measured on those three only, so coverage of templates,
      # settings and migrations elsewhere cannot mask a drop here.
      - name: Enforce NFR-005 coverage threshold
        run: >
          pytest
          --cov=budgets --cov=recurring --cov=transactions
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: G15/04_IMPLEMENTATION_TESTING/source-code/coverage.xml
          if-no-files-found: ignore
